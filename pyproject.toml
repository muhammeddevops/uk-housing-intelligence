[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-housing-intelligence"
version = "0.1.0"
description = "An end-to-end data engineering platform for UK housing market analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
